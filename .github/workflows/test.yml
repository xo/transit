# CI for transit (D36). It runs on linux/amd64 only.
#
# This is the push tier. The nightly tier (every grammar at both ABI versions)
# and the weekly tier (the long fuzz tests) come when there is something for
# them to run. See docs/PLAN.md, under CI.
on: [push, pull_request]
name: Test
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Format
      run: test -z "$(gofmt -l $(git ls-files '*.go'))"
    - name: Replace blocks
      # the replace block of each go.mod is what ./gen.sh -m writes (D49)
      run: ./gen.sh -m && git diff --exit-code
    - name: Vet
      run: go vet ./...
    - name: Test
      # the root module is pure Go (D1)
      run: CGO_ENABLED=0 go test -count=1 ./...
    - name: Race
      run: go test -race -count=1 ./...
    - name: Test module
      # the test module has its own go.mod, so ./... in the root misses it
      working-directory: test
      # the comparisons with C of every grammar module take about 15 minutes
      # under -race, more than the default timeout of 10 minutes (D87)
      run: go vet ./... && go test -race -count=1 -timeout 60m ./...
    - name: Grammar modules
      # each grammar module has its own go.mod (D26, D79). The generator test
      # of postgres needs about 12 GB, and -race makes it more than a runner
      # has, so the generator tests run once more without -race, with a
      # smaller heap
      run: for m in grammars/*/go.mod; do (cd "$(dirname "$m")" && go vet ./... && go test -race -count=1 -timeout 60m -skip TestGenerator ./... && GOGC=25 go test -count=1 -timeout 60m -run TestGenerator ./...) || exit 1; done
    - name: Styles module
      # the module styles has its own go.mod (D99)
      working-directory: styles
      run: go vet ./... && go test -race -count=1 ./...
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      # the 31 MB parser.go of postgres makes a cold lint of a module that
      # imports it need about 15 GB. With GOGC=25 and one job at a time, it
      # needs about 9 GB
      GOGC: 25
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    # pinned, because .golangci.yml sets `default: all` and a newer release
    # can turn on a linter that nobody chose
    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
    - name: Lint
      run: golangci-lint run ./...
    - name: Lint the test module
      working-directory: test
      run: golangci-lint run --concurrency 1 ./...
    - name: Lint the grammar modules
      # dupl, goconst and gosec find nothing in a grammar package and take
      # most of the memory on the generated parser.go of postgres (D109)
      run: for m in grammars/*/go.mod; do (cd "$(dirname "$m")" && golangci-lint run --concurrency 1 --disable dupl,goconst,gosec ./...) || exit 1; done
    - name: Lint the styles module
      working-directory: styles
      run: golangci-lint run ./...
