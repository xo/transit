# CI for transit (D36). It runs on linux/amd64 only.
#
# This is the push tier. The nightly tier (every grammar at both ABI versions)
# and the weekly tier (the long fuzz tests) come when there is something for
# them to run. See docs/PLAN.md, under CI.
on: [push, pull_request]
name: Test
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Format
      run: test -z "$(gofmt -l $(git ls-files '*.go'))"
    - name: Vet
      run: go vet ./...
    - name: Test
      # the root module is pure Go (D1)
      run: CGO_ENABLED=0 go test -count=1 ./...
    - name: Race
      run: go test -race -count=1 ./...
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    # pinned, because .golangci.yml sets `default: all` and a newer release
    # can turn on a linter that nobody chose
    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
    - name: Lint
      run: golangci-lint run ./...
