# Lint configuration for the root module (D36).
#
# The posture is the one of dburl: every linter is on, and a linter that makes
# idiomatic Go worse is turned off here, with the reason beside it. Only a real
# fault gets a change in the code. A change made only to quiet a linter leaves
# code that no reader can explain.
#
# The version of golangci-lint in CI is pinned, because `default: all` turns on
# each new linter that a release adds.
version: "2"

run:
  modules-download-mode: readonly

linters:
  default: all
  disable:
    # Complexity metrics count a long table or a long switch as complex code.
    # The port follows the shape of the upstream functions (D24).
    - cyclop
    - funlen
    - gocognit
    - gocyclo
    - maintidx
    - nestif
    # Style opinions that argue with gofmt or with plain code.
    - lll
    - nlreturn
    - varnamelen
    - wsl
    - wsl_v5
    - mnd
    - nilnil
    - noinlineerr
    - nonamedreturns
    # exhaustruct wants every field of every literal named, which buries the
    # field that matters.
    - exhaustruct
    - exhaustruct_v5
    # err113 and wrapcheck want every error wrapped. The errors of transit are
    # constants of a string type, as in the other xo repositories (D24).
    - err113
    - wrapcheck
    # The tests of the documents read the repository, and some tests share
    # state with a parser on purpose.
    - paralleltest
    - testpackage
    # A package level table is how the port holds the tables of upstream.
    - gochecknoglobals
    - gochecknoinits
    # prealloc rewrites readable loops for a gain that nothing measured.
    - prealloc
    # The port keeps the functions of each upstream file in the order of that
    # file (D24), and funcorder wants the unexported methods last.
    - funcorder
    # The port keeps the match arms of upstream, and a match that ends in
    # `_ =>` becomes a switch with the rest after it. exhaustive wants each
    # case named.
    - exhaustive
    # A Rust method that takes &self becomes a method with a value receiver,
    # and one that takes &mut self a method with a pointer receiver. That mix
    # is the translation, and recvcheck reports it.
    - recvcheck
    # A Rust enum with data, such as the Ast of regex-syntax, becomes an
    # interface with one struct type for each variant. A function that
    # returns the enum returns the interface, and ireturn reports it.
    - ireturn
    # The port keeps the comments of upstream, and some of them are TODO
    # comments (D24).
    - godox
    # depguard holds the rule on dependencies, so gomodguard would hold it
    # twice.
    - gomodguard
    - gomodguard_v2
    # tagliatelle wants camelCase keys in JSON. The files of transit, such as
    # grammars/grammars.json, use snake_case keys, as go-pedantry says.
    - tagliatelle
  settings:
    # D11: the root module imports only the standard library.
    depguard:
      rules:
        main:
          list-mode: strict
          allow:
            - $gostd
            - github.com/xo/transit
    gosec:
      excludes:
        # The port keeps the integer widths of upstream and its conversions
        # with `as`, which cut a value the same way (D25). G115 reports each
        # one.
        - G115
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gomoddirectives:
      # The replace block of each go.mod points at the folder of a module of
      # this repository, and ./gen.sh -m writes it (D49).
      replace-local: true
    staticcheck:
      checks:
        # the default checks of golangci-lint
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # QF1001 rewrites a boolean expression with De Morgan's law. The port
        # keeps the expressions of upstream (D24).
        - -QF1001
    revive:
      rules:
        - name: context-as-argument
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: exported
        - name: indent-error-flow
        - name: package-comments
        - name: receiver-naming
        - name: var-naming
  exclusions:
    paths:
      # the upstream checkout (D4)
      - tree-sitter
      # Ken's sample, which is C
      - _samples
    rules:
      # A test reads the files of the repository by name. It is not the attack
      # surface that gosec looks for, and a file name repeated in a test reads
      # better than a constant.
      - path: _test\.go
        linters:
          - gosec
          - goconst
          # A ported test keeps the shape of the upstream test, and upstream
          # has pairs of tests of the same shape.
          - dupl
      # The golden harness runs the upstream tool, reads the files that it
      # writes, and writes files of the repository with the modes of any
      # checkout (D58). That is what gosec warns about, and it is the job.
      - path: test/cmd/
        linters:
          - gosec
      # The package cgrammar builds the C runtime and the grammars in the
      # cache, from the files of the checkout of upstream and of the cache.
      # That is what gosec warns about, and it is the job.
      - path: test/cgrammar/
        linters:
          - gosec
      # ts_node_field_name_for_child and ts_node_field_name_for_named_child
      # are two functions of the same shape in node.c of upstream, and the
      # port keeps both (D24).
      - path: node\.go
        linters:
          - dupl
      # The generator reads the grammar file and writes the files of the
      # folder that the user names, with the modes of upstream. That is what
      # gosec warns about, and it is the job.
      - path: generate/generate\.go
        linters:
          - gosec
      # The Visitor of the port of regex-syntax has the 11 methods of the Rust
      # trait ast::Visitor.
      - path: generate/internal/regexsyntax/ast/visitor\.go
        linters:
          - interfacebloat
      # A ported test uses the text of the upstream test, such as a capture
      # name in Han characters, which gosmopolitan reports, or an input of a
      # fuzzer with repeated words, which dupword reports. A helper of a
      # ported test keeps the parameters of upstream, which unparam reports
      # when every call passes the same value.
      - path: generate/internal/regexsyntax/.*_test\.go
        linters:
          - dupword
          - gosmopolitan
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/xo/transit
  exclusions:
    paths:
      - tree-sitter
